services:
  mysql:
    image: mysql:8.4
    container_name: mysql-mini-crm
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: mini_crm_leads
      MYSQL_USER: arthur
      MYSQL_PASSWORD: "3326"
      MYSQL_ROOT_PASSWORD: "root3326"
    ports:
      - "3307:3306"
    volumes:
      - mysql_mini_crm_data:/var/lib/mysql

volumes:
  mysql_mini_crm_data:
